name: lookstudio
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Version and build information.
version: 1.0.0+1

environment:
  sdk: '>=3.2.2 <4.0.0'

# Dependencies
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1

  # Network and API
  dio: ^5.11.1
  dio_smart_retry: ^7.0.1
  flutter_native_splash: ^2.3.3

  # Custom Solutions
  value_provider:
    git:
      url: https://github.com/KadomtsevVolodymyr/value_provider.git

  # Internationalization
  intl_utils: ^2.8.7

  # UI & Icons
  cupertino_icons: ^2.0.0
  auto_route: ^11.2.0
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.3

  # Data Persistence
  hive: 2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0

  # Utilities
  email_validator: ^3.0.0
  image_picker: ^1.1.2
  permission_handler: ^13.0.2
  logger: ^2.5.0

  version: ^3.0.2

  # Device and Platform Features
  upgrader: ^13.7.0
  connectivity_plus: ^7.3.2
 # launch_review: 3.0.1
  package_info_plus: ^10.2.2

  # UI and User Experience
  flutter_dialogs: 3.0.0
  salomon_bottom_bar: 3.3.2
  flutter_list_view: ^1.1.29
  pull_to_refresh: ^2.0.0

  #databse
  floor: ^1.5.0




  #Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_remote_config: ^7.0.1

  #Auth
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.6
  freezed: ^4.0.1
  auto_route_generator: ^10.6.0
  flutter_gen: ^5.8.0
  flutter_lints: ^6.0.0

flutter_native_splash:
  image: assets/images/icons/logo.png
  color: "#ffffff"
  branding: assets/images/icons/logo.png
  color_dark: "#121212"
  image_dark: assets/images/icons/logo.png
  branding_dark: assets/images/icons/logo.png

  android_12:
    image: assets/images/icons/logo.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/icons/logo.png
    icon_background_color_dark: "#121212"

flutter_gen:
  output: lib/generated/assets
  integrations:
    flutter_svg: true

flutter:

  uses-material-design: true

  assets:
    - assets/images/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto-Regular.ttf