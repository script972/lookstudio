name: solution_starter
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=2.18.6 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  freezed_annotation: 2.2.0
  dio: 4.0.6
  dio_smart_retry: ^1.3.2
  flutter_bloc: ^8.1.1
  auto_route: ^5.0.1
  intl_utils: 2.8.1
  hive: 2.2.3
  hive_flutter: ^1.1.0
  logger: 1.1.0
  flutter_svg: ^1.1.5
  #url_launcher: 6.1.5
  flutter_dialogs: 3.0.0
  intl: 0.17.0
  local_auth: 2.1.0
  provider: 6.0.3
  shared_preferences: ^2.0.15
  connectivity_plus: 2.3.6
  shimmer: 2.0.0
  #image_picker: 0.8.6
  #photo_manager: 2.1.4
  #file_picker: 5.2.2
  syncfusion_flutter_pdfviewer: 20.3.59
  vector_math: 2.1.2
  upgrader: 4.6.1
  launch_review: 3.0.1
  version: 3.0.2
  carousel_slider: ^4.2.1
  json_annotation: ^4.7.0

  firebase_core: 2.4.1
  firebase_analytics: 10.1.0
  firebase_auth: 4.2.5
  firebase_crashlytics: 3.0.11
  firebase_remote_config: 3.0.9
  cloud_firestore: ^4.3.1
  google_sign_in: ^5.4.4

  permission_handler: 10.1.0
  flutter_native_splash: ^2.2.17


dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^2.3.2
  build_runner: any
  auto_route_generator: ^5.0.1
  flutter_gen: ^5.1.0+1
  flutter_lints: ^2.0.1


flutter_native_splash:
  image: assets/images/icons/dog_icon.png
  color: "#ffffff"
  branding: assets/images/icons/dog_icon.png
  color_dark: "#121212"
  image_dark: assets/images/icons/dog_icon.png
  branding_dark: assets/images/icons/dog_icon.png

  android_12:
    image: assets/images/icons/dog_icon.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/icons/dog_icon.png
    icon_background_color_dark: "#121212"

flutter_gen:
  output: lib/generated/assets
  integrations:
    flutter_svg: true

flutter:

  uses-material-design: true

  assets:
    - assets/images/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto-Regular.ttf

flutter_intl:
  main_locale: en_US
  enabled: true
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
